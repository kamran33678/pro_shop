<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO SHOP Cloud API Server</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      max-width: 500px;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: white;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 10px 0; font-size: 26px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● API System Online</div>
    <h1>PRO SHOP Mobile Backend</h1>
    <p>Neon Serverless PostgreSQL Database is connected.<br>REST API endpoints and Swagger documentation are ready.</p>
    <a href="/api/docs" target="_blank">Open Swagger API Docs ➔</a>
  </div>
</body>
</html>
